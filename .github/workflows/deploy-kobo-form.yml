name: Deploy Kobo Forms

on:
  push:
    paths:
      - "kobo/**"
      - "scripts/deploy_kobo_form.py"
      - ".github/workflows/deploy-kobo-form.yml"
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-form:
    runs-on: ubuntu-latest
    strategy:
      # One at a time: concurrent imports into Kobo are not safe.
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - file: kobo/appeals_monitor_subscription.xlsx
            name: Appeals Monitor Subscription
            uid_secret: KOBO_FORM_UID
          - file: kobo/appeals_monitor_feedback.xlsx
            name: Appeals Monitor Feedback
            uid_secret: KOBO_FEEDBACK_FORM_UID
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Deploy ${{ matrix.file }} to KoboToolbox
        env:
          KOBO_API_URL: ${{ secrets.KOBO_API_URL }}
          KOBO_API_TOKEN: ${{ secrets.KOBO_API_TOKEN }}
          FORM_UID: ${{ secrets[matrix.uid_secret] }}
        run: |
          uv run --no-project --with requests python scripts/deploy_kobo_form.py \
            --file "${{ matrix.file }}" \
            --uid "${FORM_UID}" \
            --name "${{ matrix.name }}"
